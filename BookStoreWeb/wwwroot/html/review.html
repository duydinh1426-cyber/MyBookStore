<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá – Book Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&subset=vietnamese&display=swap">
    <style>
        *, *::before, *::after {
            box-sizing: border-box
        }

        body {
            font-family: 'DM Sans','Segoe UI',sans-serif;
            background: #f5f7fa;
            min-height: 100vh
        }

        .rv-page {
            max-width: 620px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem
        }

        /* Breadcrumb */
        .rv-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6ab04c;
            font-weight: 600;
            font-size: .88rem;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

            .rv-back:hover {
                color: #4e8a35
            }

        /* Book preview card */
        .rv-book-card {
            background: #fff;
            border-radius: 14px;
            border: 1.5px solid #e8edf2;
            padding: 1.2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .rv-book-img {
            width: 64px;
            height: 88px;
            object-fit: cover;
            border-radius: 7px;
            background: #f0f7eb;
            flex-shrink: 0;
        }

        .rv-book-img-ph {
            width: 64px;
            height: 88px;
            border-radius: 7px;
            background: #f0f7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6ab04c;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .rv-book-title {
            font-weight: 700;
            font-size: .95rem;
            color: #1a1a1a;
            line-height: 1.3
        }

        .rv-book-author {
            font-size: .8rem;
            color: #8a9bb0;
            margin-top: 3px
        }

        /* Form card */
        .rv-form-card {
            background: #fff;
            border-radius: 14px;
            border: 1.5px solid #e8edf2;
            padding: 1.75rem;
        }

        .rv-section-title {
            font-family: 'Playfair Display',serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .rv-section-title i {
                color: #6ab04c
            }

        /* Star picker */
        .rv-star-label {
            font-size: .82rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: .5rem
        }

        .rv-stars {
            display: flex;
            gap: 6px;
            margin-bottom: 1.25rem
        }

            .rv-stars i {
                font-size: 2.2rem;
                color: #e0e0e0;
                cursor: pointer;
                transition: color .12s, transform .12s;
            }

                .rv-stars i:hover,
                .rv-stars i.on {
                    color: #f39c12
                }

                .rv-stars i:hover {
                    transform: scale(1.15)
                }

        .rv-star-hint {
            font-size: .78rem;
            color: #8a9bb0;
            margin-left: 4px;
            display: inline-block;
            margin-bottom: 1.1rem;
        }

        /* Textarea */
        .rv-label {
            font-size: .82rem;
            font-weight: 600;
            color: #4a5568;
            display: block;
            margin-bottom: 5px
        }

        .rv-textarea {
            width: 100%;
            border: 1.5px solid #e8edf2;
            border-radius: 11px;
            padding: .75rem .9rem;
            font-family: inherit;
            font-size: .9rem;
            resize: vertical;
            min-height: 120px;
            outline: none;
            transition: border-color .15s;
        }

            .rv-textarea:focus {
                border-color: #6ab04c;
                box-shadow: 0 0 0 3px rgba(106,176,76,.1)
            }

        .rv-char-count {
            font-size: .74rem;
            color: #aaa;
            text-align: right;
            margin-top: 3px
        }

        /* Alert */
        .rv-alert {
            border-radius: 10px;
            padding: .65rem .9rem;
            font-size: .83rem;
            display: none;
            align-items: center;
            gap: 7px;
            margin-bottom: 1rem;
        }

            .rv-alert.show {
                display: flex
            }

            .rv-alert.error {
                background: #fff0f0;
                border: 1.5px solid #f5c6c6;
                color: #c0392b
            }

            .rv-alert.success {
                background: #f0fff4;
                border: 1.5px solid #b7e4c7;
                color: #1e7e34
            }

        /* Submit */
        .rv-submit {
            width: 100%;
            background: #6ab04c;
            color: #fff;
            border: none;
            border-radius: 11px;
            padding: .78rem;
            font-size: .97rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background .15s,transform .1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 1.1rem;
        }

            .rv-submit:hover {
                background: #4e8a35;
                transform: translateY(-1px)
            }

            .rv-submit:disabled {
                background: #ccc;
                cursor: not-allowed;
                transform: none
            }

        /* Success screen */
        .rv-success {
            text-align: center;
            padding: 2.5rem 1rem;
            background: #fff;
            border-radius: 14px;
            border: 1.5px solid #e8edf2;
            display: none;
        }

            .rv-success.show {
                display: block
            }

        .rv-success-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #f0fff4;
            border: 2px solid #b7e4c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #27ae60;
            margin: 0 auto 1rem;
        }

        /* Star names */
        .star-names {
            font-size: .8rem;
            color: #f39c12;
            font-weight: 600;
            min-height: 1.2em;
            margin-bottom: .9rem;
        }

        /* ══ Pending review list ══ */
        .pr-page {
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem
        }

        .pr-page-title {
            font-family: 'Playfair Display',serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 1.4rem
        }

            .pr-page-title i {
                color: #f39c12
            }

        .pr-order-group {
            background: #fff;
            border-radius: 14px;
            border: 1.5px solid #e8edf2;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: box-shadow .2s
        }

            .pr-order-group:hover {
                box-shadow: 0 4px 20px rgba(0,0,0,.07)
            }

        .pr-order-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: .75rem 1.2rem;
            background: linear-gradient(90deg,#f8fdf5,#fafafa);
            border-bottom: 1px solid #f0f0f0
        }

        .pr-order-id {
            font-weight: 700;
            font-size: .87rem;
            color: #1a1a1a
        }

        .pr-order-date {
            font-size: .74rem;
            color: #8a9bb0;
            margin-top: 1px
        }

        .pr-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: .85rem 1.2rem;
            border-bottom: 1px solid #f7f7f7;
            transition: background .15s
        }

            .pr-item:last-child {
                border-bottom: none
            }

            .pr-item:hover {
                background: #fafffe
            }

        .pr-item-img {
            width: 52px;
            height: 72px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: #f0f7eb
        }

        .pr-item-ph {
            width: 52px;
            height: 72px;
            border-radius: 6px;
            background: #f0f7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6ab04c;
            font-size: 1.3rem;
            flex-shrink: 0
        }

        .pr-item-info {
            flex: 1;
            min-width: 0
        }

        .pr-item-title {
            font-weight: 700;
            font-size: .88rem;
            color: #1a1a1a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .pr-item-author {
            font-size: .76rem;
            color: #8a9bb0;
            margin-top: 2px
        }

        .pr-item-qty {
            font-size: .75rem;
            color: #aab4be;
            margin-top: 2px
        }

        .pr-review-btn, a.pr-review-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: linear-gradient(135deg,#f39c12,#e67e22);
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: .45rem .95rem;
            font-size: .8rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
            transition: transform .15s,box-shadow .15s;
            box-shadow: 0 2px 8px rgba(243,156,18,.3);
            text-decoration: none
        }

            .pr-review-btn:hover, a.pr-review-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 4px 14px rgba(243,156,18,.45);
                color: #fff
            }

        .pr-empty {
            text-align: center;
            padding: 3.5rem 1rem;
            color: #8a9bb0
        }

        .pr-empty-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #f0fff4;
            border: 2px solid #b7e4c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #27ae60;
            margin: 0 auto 1rem
        }

        .pr-empty p {
            font-weight: 600;
            font-size: 1rem;
            color: #1a1a1a;
            margin-bottom: .3rem
        }

        .pr-done-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f0fff4;
            color: #27ae60;
            border: 1.5px solid #b7e4c7;
            border-radius: 8px;
            padding: .28rem .7rem;
            font-size: .75rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0
        }

        /* ══ Tabs ══ */
        .rv-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 1.4rem;
            border-bottom: 2px solid #e8edf2;
            padding-bottom: 0;
        }

        .rv-tab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: .55rem 1.1rem;
            font-size: .88rem;
            font-weight: 700;
            color: #8a9bb0;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            border-bottom: 2.5px solid transparent;
            margin-bottom: -2px;
            transition: color .15s, border-color .15s;
        }

            .rv-tab:hover {
                color: #4a5568;
            }

            .rv-tab.active {
                color: #6ab04c;
                border-bottom-color: #6ab04c;
            }

        .rv-tab-badge {
            background: #f0fff4;
            color: #27ae60;
            border-radius: 20px;
            padding: .1rem .5rem;
            font-size: .72rem;
            font-weight: 800;
            min-width: 22px;
            text-align: center;
        }

        .rv-tab.active .rv-tab-badge {
            background: #6ab04c;
            color: #fff;
        }

        /* ══ History items ══ */
        .rv-hist-card {
            background: #fff;
            border-radius: 12px;
            border: 1.5px solid #e8edf2;
            padding: 1rem 1.2rem;
            margin-bottom: .75rem;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: box-shadow .18s;
        }

            .rv-hist-card:hover {
                box-shadow: 0 3px 16px rgba(0,0,0,.07);
            }

            .rv-hist-card:last-child {
                margin-bottom: 0;
            }

        .rv-hist-img {
            width: 52px;
            height: 72px;
            object-fit: cover;
            border-radius: 7px;
            flex-shrink: 0;
            background: #f0f7eb;
        }

        .rv-hist-ph {
            width: 52px;
            height: 72px;
            border-radius: 7px;
            background: #f0f7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6ab04c;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .rv-hist-stars {
            display: inline-flex;
            gap: 2px;
        }

            .rv-hist-stars i {
                font-size: .78rem;
            }

        .rv-hist-comment {
            background: #f8fdf5;
            border-radius: 8px;
            padding: .45rem .7rem;
            font-size: .81rem;
            color: #4a5568;
            line-height: 1.6;
            border-left: 3px solid #6ab04c;
            margin-top: .45rem;
        }

        .rv-hist-pager {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 1rem;
        }

        .rv-hist-pg {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1.5px solid #e8edf2;
            background: #fff;
            cursor: pointer;
            font-size: .8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            transition: all .15s;
        }

            .rv-hist-pg:hover {
                border-color: #6ab04c;
                color: #6ab04c;
            }

            .rv-hist-pg.active {
                background: #6ab04c;
                border-color: #6ab04c;
                color: #fff;
            }

            .rv-hist-pg:disabled {
                opacity: .35;
                cursor: not-allowed;
            }

        /* Nút xóa đánh giá */
        .rv-hist-del {
            background: none;
            border: 1.5px solid #f5c6c6;
            border-radius: 8px;
            color: #e74c3c;
            padding: .28rem .6rem;
            font-size: .78rem;
            cursor: pointer;
            flex-shrink: 0;
            align-self: flex-start;
            transition: background .15s, border-color .15s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

            .rv-hist-del:hover {
                background: #fdf2f2;
                border-color: #e74c3c;
            }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>


    <!-- Modal xác nhận xóa đánh giá -->
    <div class="modal fade" id="rvDelModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content" style="border-radius:14px;border:none">
                <div class="modal-body" style="padding:1.75rem;text-align:center">
                    <i class="bi bi-trash3-fill" style="font-size:2.2rem;color:#e74c3c;display:block;margin-bottom:.75rem"></i>
                    <div style="font-weight:700;font-size:1rem;margin-bottom:.4rem">Xóa đánh giá?</div>
                    <div style="font-size:.85rem;color:#8a9bb0;margin-bottom:1rem">Hành động này không thể hoàn tác.</div>
                    <!-- Error message inside modal -->
                    <div id="rvDelErrMsg" style="display:none;background:#fff0f0;border:1.5px solid #f5c6c6;border-radius:9px;padding:.5rem .8rem;font-size:.82rem;color:#c0392b;margin-bottom:1rem;text-align:left">
                        <i class="bi bi-exclamation-circle-fill me-1"></i>
                        <span id="rvDelErrText"></span>
                    </div>
                    <div style="display:flex;gap:10px;justify-content:center">
                        <button class="btn btn-light" style="border-radius:9px;font-weight:600;min-width:85px" data-bs-dismiss="modal">Hủy</button>
                        <button class="btn btn-danger" id="rvDelConfirmBtn" style="border-radius:9px;font-weight:600;min-width:85px">Xóa</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ══ LIST VIEW (hiện khi không có ?bookId) ══ -->
    <div id="prListView" style="display:none">
        <div class="pr-page">
            <h2 class="pr-page-title"><i class="bi bi-star-fill"></i> Đánh giá của tôi</h2>

            <!-- Tabs -->
            <div class="rv-tabs">
                <button class="rv-tab active" id="tabPending" onclick="switchTab('pending')">
                    <i class="bi bi-pencil-square"></i> Chờ đánh giá
                    <span class="rv-tab-badge" id="badgePending">...</span>
                </button>
                <button class="rv-tab" id="tabHistory" onclick="switchTab('history')">
                    <i class="bi bi-clock-history"></i> Lịch sử
                    <span class="rv-tab-badge" id="badgeHistory">...</span>
                </button>
            </div>

            <div id="prListContent"></div>
            <div id="prHistContent" style="display:none"></div>
        </div>
    </div>

    <div class="rv-page">
        <a class="rv-back" id="backLink" href="orders.html" style="display:none">
            <i class="bi bi-arrow-left"></i> Quay lại đơn hàng
        </a>

        <!-- Book info -->
        <div class="rv-book-card" id="bookCard">
            <div style="text-align:center;padding:1rem;color:#8a9bb0;width:100%">
                <div class="spinner-border spinner-border-sm text-success"></div>
            </div>
        </div>

        <!-- Form -->
        <div class="rv-form-card" id="formCard">
            <div class="rv-section-title">
                <i class="bi bi-pencil-square"></i> Viết đánh giá của bạn
            </div>

            <div class="rv-alert" id="rvAlert">
                <i class="bi bi-exclamation-circle-fill" style="flex-shrink:0"></i>
                <span id="rvAlertMsg"></span>
            </div>

            <div class="rv-star-label">Chọn số sao <span style="color:#e74c3c">*</span></div>
            <div class="rv-stars" id="starPicker">
                <i class="bi bi-star-fill" data-v="1"></i>
                <i class="bi bi-star-fill" data-v="2"></i>
                <i class="bi bi-star-fill" data-v="3"></i>
                <i class="bi bi-star-fill" data-v="4"></i>
                <i class="bi bi-star-fill" data-v="5"></i>
            </div>
            <div class="star-names" id="starName"></div>

            <label class="rv-label" for="rvComment">
                Nhận xét <span style="color:#8a9bb0;font-weight:400">(không bắt buộc)</span>
            </label>
            <textarea class="rv-textarea" id="rvComment"
                      placeholder="Chia sẻ cảm nhận của bạn về cuốn sách này..."
                      oninput="updateCharCount()"></textarea>
            <div class="rv-char-count" id="charCount">0 / 500</div>

            <button class="rv-submit" id="rvSubmit" onclick="submitReview()">
                <i class="bi bi-send"></i> Gửi đánh giá
            </button>
        </div>

        <!-- Success -->
        <div class="rv-success" id="successCard">
            <div class="rv-success-icon"><i class="bi bi-check-lg"></i></div>
            <h5 style="font-family:'Playfair Display',serif;font-weight:700;margin-bottom:.4rem">
                Cảm ơn bạn đã đánh giá!
            </h5>
            <p style="font-size:.88rem;color:#8a9bb0;margin-bottom:1.5rem">
                Đánh giá của bạn đã được ghi nhận.
            </p>
            <a href="orders.html"
               style="display:inline-flex;align-items:center;gap:6px;
                  background:#6ab04c;color:#fff;border-radius:10px;
                  padding:.6rem 1.4rem;font-weight:700;font-size:.9rem;
                  text-decoration:none;transition:background .15s"
               onmouseover="this.style.background='#4e8a35'"
               onmouseout="this.style.background='#6ab04c'">
                <i class="bi bi-bag-check"></i> Xem đơn hàng
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/header.js"></script>
    <script>
        /* List mode for review.html — runs when no ?bookId in URL */
        (function () {
            var params = new URLSearchParams(window.location.search);
            var bookId = parseInt(params.get("bookId") || "0");

            var listView = document.getElementById("prListView");
            var formPages = document.querySelectorAll(".rv-page");

            if (bookId) {
                // Form mode: hide list, keep form visible
                listView.style.display = "none";
                return;
            }

            // List mode: show list, hide form
            listView.style.display = "block";
            formPages.forEach(function (el) { el.style.display = "none"; });

            var API = "https://localhost:7204/api";
            var IMG_URL = "https://localhost:7204";
            var getToken = function () { return sessionStorage.getItem("token"); };
            var isLoggedIn = function () { return !!getToken(); };
            var authHdr = function () {
                return { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() };
            };
            var imgSrc = function (raw) {
                if (!raw) return "";
                if (/^https?:\/\//i.test(raw)) return raw;
                return IMG_URL + "/images/" + raw.replace(/^\/?(?:images\/)?/, "");
            };

            if (!isLoggedIn()) { window.location.replace("login.html"); return; }

            loadList();

            // ── Tab switching ──
            var currentTab = 'pending';
            var histLoaded = false;

            window.switchTab = function (tab) {
                currentTab = tab;
                document.getElementById('tabPending').classList.toggle('active', tab === 'pending');
                document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
                document.getElementById('prListContent').style.display = tab === 'pending' ? '' : 'none';
                document.getElementById('prHistContent').style.display = tab === 'history' ? '' : 'none';
                if (tab === 'history' && !histLoaded) {
                    histLoaded = true;
                    loadHistory(1);
                }
            };

            // ── History ──
            var HIST_PAGE_SIZE = 6;
            var _delModal = new bootstrap.Modal(document.getElementById('rvDelModal'));
            var _pendingDelId = null;
            var _histPageCurrent = 1;
            // expose to window so inline onclick can access
            window._delModal = _delModal;
            window._pendingDelId = null;

            document.getElementById('rvDelConfirmBtn').addEventListener('click', async function () {
                if (!window._pendingDelId) return;
                var btn = this;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Đang xóa...';
                document.getElementById('rvDelErrMsg').style.display = 'none';
                try {
                    var res = await fetch(API + '/reviews/my/' + window._pendingDelId, {
                        method: 'DELETE', headers: authHdr()
                    });
                    if (res.ok) {
                        window._delModal.hide();
                        loadHistory(_histPageCurrent);
                    } else {
                        var data = await res.json().catch(function () { return {}; });
                        var errText = document.getElementById('rvDelErrText');
                        errText.textContent = data.message || ('Lỗi ' + res.status + ': Xóa thất bại.');
                        document.getElementById('rvDelErrMsg').style.display = 'block';
                    }
                } catch (e) {
                    document.getElementById('rvDelErrText').textContent = 'Không kết nối được máy chủ.';
                    document.getElementById('rvDelErrMsg').style.display = 'block';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = 'Xóa';
                    window._pendingDelId = null;
                }
            });

            // Reset error khi mở modal
            document.getElementById('rvDelModal').addEventListener('show.bs.modal', function () {
                document.getElementById('rvDelErrMsg').style.display = 'none';
            });

            async function loadHistory(page) {
                _histPageCurrent = page;
                var cont = document.getElementById('prHistContent');
                cont.innerHTML = '<div class="pr-empty"><div class="spinner-border text-success spinner-border-sm"></div></div>';
                try {
                    var res = await fetch(API + '/reviews/my?page=' + page + '&pageSize=' + HIST_PAGE_SIZE, { headers: authHdr() });
                    if (!res.ok) throw new Error();
                    var data = await res.json();
                    var reviews = data.data || [];

                    document.getElementById('badgeHistory').textContent = data.total || 0;

                    if (!reviews.length) {
                        cont.innerHTML = '<div class="pr-empty"><div class="pr-empty-icon"><i class="bi bi-chat-square-text"></i></div>'
                            + '<p>Bạn chưa có đánh giá nào.</p><small>Mua sách và chia sẻ cảm nhận nhé!</small></div>';
                        return;
                    }

                    var html = '';
                    reviews.forEach(function (r) {
                        var src = imgSrc(r.bookImage || '');
                        var imgHtml = src
                            ? '<img class="rv-hist-img" src="' + src + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
                            + '<div class="rv-hist-ph" style="display:none"><i class="bi bi-book"></i></div>'
                            : '<div class="rv-hist-ph"><i class="bi bi-book"></i></div>';

                        var starsHtml = '';
                        for (var s = 1; s <= 5; s++) {
                            starsHtml += '<i class="bi ' + (s <= r.rating ? 'bi-star-fill' : 'bi-star') + '" style="color:' + (s <= r.rating ? '#f39c12' : '#ddd') + '"></i>';
                        }

                        var date = r.createdAt ? new Date(r.createdAt).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';

                        html += '<div class="rv-hist-card" id="rvhist-' + r.reviewId + '">'
                            + imgHtml
                            + '<div style="flex:1;min-width:0">'
                            + '<div style="font-weight:700;font-size:.88rem;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (r.bookTitle || '—') + '</div>'
                            + '<div style="display:flex;align-items:center;gap:8px;margin-top:.3rem">'
                            + '<span class="rv-hist-stars">' + starsHtml + '</span>'
                            + '<span style="font-size:.75rem;color:#f39c12;font-weight:700">' + r.rating + '/5</span>'
                            + (date ? '<span style="font-size:.73rem;color:#aab4be;margin-left:auto"><i class="bi bi-calendar3 me-1"></i>' + date + '</span>' : '')
                            + '</div>'
                            + (r.comment
                                ? '<div class="rv-hist-comment"><i class="bi bi-chat-left-quote me-1" style="color:#aaa"></i>' + r.comment + '</div>'
                                : '<div style="margin-top:.35rem;font-size:.78rem;color:#ccc;font-style:italic">Không có nhận xét</div>')
                            + '</div>'
                            + '<button class="rv-hist-del" title="Xóa đánh giá" onclick="window._pendingDelId=' + r.reviewId + ';window._delModal.show()">'
                            + '<i class="bi bi-trash3"></i>'
                            + '</button>'
                            + '</div>';
                    });

                    // Pager
                    if (data.totalPages > 1) {
                        html += '<div class="rv-hist-pager">';
                        html += '<button class="rv-hist-pg" ' + (page === 1 ? 'disabled' : '') + ' onclick="loadHistory(' + (page - 1) + ')"><i class="bi bi-chevron-left"></i></button>';
                        for (var pg = 1; pg <= data.totalPages; pg++) {
                            html += '<button class="rv-hist-pg ' + (pg === page ? 'active' : '') + '" onclick="loadHistory(' + pg + ')">' + pg + '</button>';
                        }
                        html += '<button class="rv-hist-pg" ' + (page === data.totalPages ? 'disabled' : '') + ' onclick="loadHistory(' + (page + 1) + ')"><i class="bi bi-chevron-right"></i></button>';
                        html += '</div>';
                    }

                    cont.innerHTML = html;
                } catch (e) {
                    cont.innerHTML = '<div class="pr-empty"><i class="bi bi-wifi-off" style="font-size:2rem;color:#d0d9e2;display:block;margin-bottom:.5rem"></i>'
                        + '<p>Không tải được dữ liệu</p></div>';
                }
            }

            async function loadList() {
                var cont = document.getElementById("prListContent");
                cont.innerHTML = '<div class="pr-empty"><div class="spinner-border text-success"></div></div>';

                try {
                    var allOrders = [];
                    for (var pg = 1; pg <= 5; pg++) {
                        var res = await fetch(API + "/orders/my?page=" + pg + "&pageSize=10&status=completed", { headers: authHdr() });
                        if (!res.ok) break;
                        var data = await res.json();
                        allOrders = allOrders.concat(data.data || []);
                        if (pg >= (data.totalPages || 1)) break;
                    }

                    if (!allOrders.length) { renderEmpty("Bạn chưa có đơn hàng hoàn thành nào."); return; }

                    var grouped = [];
                    await Promise.all(allOrders.map(async function (o) {
                        try {
                            var dr = await fetch(API + "/orders/" + o.orderId, { headers: authHdr() });
                            var det = dr.ok ? await dr.json() : null;
                            if (!det || !det.items || !det.items.length) return;
                            var unreviewed = [];
                            await Promise.all(det.items.map(async function (it) {
                                var bid = it.book && it.book.bookId;
                                if (!bid) return;
                                try {
                                    var rvr = await fetch(API + "/reviews/status/" + bid, { headers: authHdr() });
                                    var rv = rvr.ok ? await rvr.json() : {};
                                    if (rv.canReview === true) {
                                        unreviewed.push({
                                            bookId: bid,
                                            title: (it.book.title || "Sách"),
                                            author: (it.book.author || ""),
                                            image: imgSrc(it.book.image || ""),
                                            qty: (it.quantity || 1)
                                        });
                                    }
                                } catch (e) { }
                            }));
                            if (unreviewed.length) {
                                grouped.push({ orderId: o.orderId, orderDate: o.createdAt, items: unreviewed });
                            }
                        } catch (e) { }
                    }));

                    grouped.sort(function (a, b) { return b.orderId - a.orderId; });

                    if (!grouped.length) { document.getElementById('badgePending').textContent = 0; renderEmpty("Tất cả sản phẩm đã được đánh giá rồi. Cảm ơn bạn!"); return; }

                    var total = grouped.reduce(function (s, g) { return s + g.items.length; }, 0);
                    document.getElementById('badgePending').textContent = total;
                    var html = '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:1rem">'
                        + '<div style="font-size:.82rem;color:#8a9bb0">Chia sẻ cảm nhận về các sản phẩm bạn đã mua</div>'
                        + '<span style="background:#fff8ec;color:#d68910;border:1.5px solid #ffe0a0;border-radius:20px;padding:.3rem .85rem;font-size:.8rem;font-weight:700">'
                        + '<i class="bi bi-pencil-square me-1"></i>' + total + ' sản phẩm'
                        + '</span>'
                        + '</div>';
                    grouped.forEach(function (g) { html += renderGroup(g); });
                    cont.innerHTML = html;

                } catch (e) {
                    cont.innerHTML = '<div class="pr-empty"><i class="bi bi-wifi-off" style="font-size:2.5rem;color:#d0d9e2;display:block;margin-bottom:.8rem"></i>'
                        + '<p>Không tải được dữ liệu</p><small>Vui lòng thử lại sau.</small></div>';
                }
            }

            function renderEmpty(msg) {
                document.getElementById("prListContent").innerHTML =
                    '<div class="pr-empty">'
                    + '<div class="pr-empty-icon"><i class="bi bi-patch-check-fill"></i></div>'
                    + '<p>' + msg + '</p>'
                    + '<small>Mua thêm sách và quay lại nhé!</small>'
                    + '</div>';
            }

            function renderGroup(group) {
                var d = group.orderDate
                    ? new Date(group.orderDate).toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" })
                    : "";
                var items = "";
                group.items.forEach(function (it) {
                    var imgHtml = it.image
                        ? '<img class="pr-item-img" src="' + it.image + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
                        + '<div class="pr-item-ph" style="display:none"><i class="bi bi-book"></i></div>'
                        : '<div class="pr-item-ph"><i class="bi bi-book"></i></div>';
                    items +=
                        '<div class="pr-item" id="pr-item-' + group.orderId + '-' + it.bookId + '">'
                        + imgHtml
                        + '<div class="pr-item-info">'
                        + '<div class="pr-item-title">' + it.title + '</div>'
                        + (it.author ? '<div class="pr-item-author">' + it.author + '</div>' : '')
                        + '<div class="pr-item-qty">Số lượng: ' + it.qty + '</div>'
                        + '</div>'
                        + '<a class="pr-review-btn" href="review.html?bookId=' + it.bookId + '&orderId=' + group.orderId + '">'
                        + '<i class="bi bi-star-fill"></i> Đánh giá'
                        + '</a>'
                        + '</div>';
                });
                return '<div class="pr-order-group">'
                    + '<div class="pr-order-head">'
                    + '<div>'
                    + '<div class="pr-order-id"><i class="bi bi-bag text-success me-1"></i>Đơn #' + group.orderId + '</div>'
                    + (d ? '<div class="pr-order-date"><i class="bi bi-clock me-1"></i>' + d + '</div>' : '')
                    + '</div>'
                    + '<span style="background:#fff8ec;color:#d68910;border:1.5px solid #ffe0a0;border-radius:20px;padding:.22rem .7rem;font-size:.75rem;font-weight:700">'
                    + group.items.length + ' sản phẩm'
                    + '</span>'
                    + '</div>'
                    + items
                    + '</div>';
            }
        })();
    </script>

    <script>
        (function () {
            const API = "https://localhost:7204/api";
            const IMG_URL = "https://localhost:7204";

            const getToken = () => sessionStorage.getItem("token");
            const isLoggedIn = () => !!getToken();
            const authHeaders = () => ({
                "Content-Type": "application/json",
                "Authorization": `Bearer ${getToken()}`
            });
            const imgSrc = raw => {
                if (!raw) return "";
                if (/^https?:\/\//i.test(raw)) return raw;
                return IMG_URL + "/images/" + raw.replace(/^\/?(images\/)?/, "");
            };

            if (!isLoggedIn()) { window.location.replace("login.html"); return; }

            // Đọc ?bookId= từ URL
            const params = new URLSearchParams(window.location.search);
            const bookId = parseInt(params.get("bookId"));
            const orderId = params.get("orderId");

            if (!bookId) { return; } // list mode đã xử lý ở script trên

            // Form mode: hiện nút quay lại
            document.getElementById("backLink").style.display = "";

            if (orderId) {
                document.getElementById("backLink").href = `orders.html`;
            }

            // Star names
            const STAR_NAMES = ["", "Rất tệ", "Không tốt", "Bình thường", "Khá tốt", "Tuyệt vời!"];
            let pickedStar = 0;

            // Star picker
            const stars = document.querySelectorAll("#starPicker i");
            stars.forEach(el => {
                el.addEventListener("mouseenter", () => highlightStars(parseInt(el.dataset.v)));
                el.addEventListener("mouseleave", () => highlightStars(pickedStar));
                el.addEventListener("click", () => {
                    pickedStar = parseInt(el.dataset.v);
                    highlightStars(pickedStar);
                    document.getElementById("starName").textContent = STAR_NAMES[pickedStar];
                    document.getElementById("rvAlert").classList.remove("show");
                });
            });

            function highlightStars(n) {
                stars.forEach((el, i) => el.classList.toggle("on", i < n));
            }

            window.updateCharCount = function () {
                const v = document.getElementById("rvComment").value;
                document.getElementById("charCount").textContent = `${v.length} / 500`;
                if (v.length > 500)
                    document.getElementById("rvComment").value = v.slice(0, 500);
            };

            // Kiểm tra trạng thái review (đã đánh giá chưa, có quyền chưa)
            async function checkReviewStatus() {
                try {
                    const res = await fetch(`${API}/reviews/status/${bookId}`, { headers: authHeaders() });
                    const data = await res.json();

                    if (!data.canReview) {
                        if (data.reason === "already_reviewed") {
                            showAlert("Bạn đã đánh giá cuốn sách này rồi.", "error");
                            document.getElementById("rvSubmit").disabled = true;
                        } else if (data.reason === "not_purchased") {
                            showAlert("Bạn chưa mua cuốn sách này hoặc đơn hàng chưa hoàn thành.", "error");
                            document.getElementById("rvSubmit").disabled = true;
                        }
                    }
                } catch { }
            }

            // Load book info
            async function loadBook() {
                try {
                    const res = await fetch(`${API}/books/${bookId}`);
                    const b = await res.json();
                    const src = imgSrc(b.image || b.Image || "");
                    document.getElementById("bookCard").innerHTML = `
                                ${src ? `<img class="rv-book-img" src="${src}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ""}
                                <div class="rv-book-img-ph" ${src ? 'style="display:none"' : ""}><i class="bi bi-book"></i></div>
                                <div>
                                    <div class="rv-book-title">${b.title || b.Title || ""}</div>
                                    <div class="rv-book-author">${b.author || b.Author || ""}</div>
                                    <div style="font-size:.78rem;color:#6ab04c;font-weight:700;margin-top:5px">
                                        ${(b.categoryName || b.CategoryName || "")}
                                    </div>
                                </div>`;
                } catch {
                    document.getElementById("bookCard").innerHTML =
                        `<div style="color:#aaa;font-size:.85rem">Không tải được thông tin sách.</div>`;
                }
            }

            function showAlert(msg, type) {
                const el = document.getElementById("rvAlert");
                const txt = document.getElementById("rvAlertMsg");
                txt.textContent = msg;
                el.className = `rv-alert ${type} show`;
                el.querySelector("i").className = type === "success"
                    ? "bi bi-check-circle-fill"
                    : "bi bi-exclamation-circle-fill";
            }

            window.submitReview = async function () {
                document.getElementById("rvAlert").classList.remove("show");

                if (!pickedStar) {
                    showAlert("Vui lòng chọn số sao trước khi gửi.", "error");
                    return;
                }

                const comment = document.getElementById("rvComment").value.trim();
                const btn = document.getElementById("rvSubmit");
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang gửi...';

                try {
                    const res = await fetch(`${API}/reviews`, {
                        method: "POST", headers: authHeaders(),
                        body: JSON.stringify({ bookId, rating: pickedStar, comment })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        const msg = data.message || data.Message
                            || Object.values(data.errors || {})[0]?.[0]
                            || "Gửi đánh giá thất bại.";
                        showAlert(msg, "error");
                        btn.disabled = false;
                        btn.innerHTML = '<i class="bi bi-send"></i> Gửi đánh giá';
                        return;
                    }

                    // Ẩn form, hiện success
                    document.getElementById("formCard").style.display = "none";
                    document.getElementById("bookCard").style.display = "none";
                    document.querySelector(".rv-back").style.display = "none";
                    document.getElementById("successCard").classList.add("show");

                } catch {
                    showAlert("Không kết nối được máy chủ.", "error");
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-send"></i> Gửi đánh giá';
                }
            };

            loadBook();
            checkReviewStatus();
        })();
    </script>
</body>
</html>
